window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();xInstallEvt=e;if(ui.tab==='data')render();});
(function(){try{
 if(!/^https?:$/.test(location.protocol)||!('serviceWorker' in navigator))return;
 if(!document.querySelector('link[rel="manifest"]')){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}
 const reg=()=>navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(document.readyState==='complete')reg();else window.addEventListener('load',reg);
}catch(e){}})();
async function xNotify(title,body){
 try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){const r=await navigator.serviceWorker.ready;await r.showNotification(title,{body,icon:'icon-192.png',tag:title});return;}}catch(e){}
 try{new Notification(title,{body});}catch(e){}
}
function xReminderTick(){
 try{
  const r=state.extra&&state.extra.remind;if(!r||!r.on||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const now=new Date(),t=todayISO(),min=now.getHours()*60+now.getMinutes(),lead=num(r.lead)||10;
  const fire=(key,at,title,body)=>{if(min<at||min>at+10)return;const k='lifecat::rem::'+t+'::'+key;try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(e){return;}xNotify(title,body);};
  const d=PLAN.days.find(x=>x.date===t&&!x.dropped);
  if(d&&!paused(t)){const st=xSlotStart(d.slot);if(st!=null)fire('plan',st-lead,'CAT block in '+lead+' minutes',d.title+' \u00B7 '+d.slot);}
  if(!state.daily[t])fire('log',21*60+30,'Log your day','Two minutes: habits, sleep and tomorrow\'s one priority.');
 }catch(e){}
}
setInterval(xReminderTick,30000);
function xIcsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function xIcsFold(line){const out=[];while(line.length>73){out.push(line.slice(0,73));line=' '+line.slice(73);}out.push(line);return out.join('\r\n');}
function xIcs(weeks){
 const t=todayISO(),end=weeks?addDays(t,weeks*7):'9999-12-31',lead=num(state.extra.remind.lead)||10,stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//lifecat//CAT 2027 planner//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:CAT 2027 plan'];
 const tm=m=>pad(Math.floor(m/60)%24)+pad(m%60)+'00';
 PLAN.days.filter(d=>!d.dropped&&d.date>=t&&d.date<=end).forEach(d=>{
  const st=xSlotStart(d.slot),ymd=d.date.replace(/-/g,'');
  L.push('BEGIN:VEVENT','UID:lifecat-'+(d.orig||d.date)+'@cat2027-plan','DTSTAMP:'+stamp);
  if(st==null)L.push('DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+addDays(d.date,1).replace(/-/g,''));
  else{const e=st+num(d.mins);L.push('DTSTART:'+ymd+'T'+tm(st),'DTEND:'+(e>=1440?addDays(d.date,1).replace(/-/g,''):ymd)+'T'+tm(e%1440));}
  L.push('SUMMARY:'+xIcsEsc('CAT: '+d.title),'DESCRIPTION:'+xIcsEsc(d.steps.map(s=>s[0]+' min: '+s[1]).join('\n')+(d.mvd?'\nRough day: '+d.mvd:'')));
  if(st!=null)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+xIcsEsc(d.title),'TRIGGER:-PT'+lead+'M','END:VALARM');
  L.push('END:VEVENT');
 });
 L.push('END:VCALENDAR');
 return L.map(xIcsFold).join('\r\n')+'\r\n';
}
function xAppPanel(){
 const r=state.extra.remind,perm=typeof Notification==='undefined'?'unsupported':Notification.permission,hosted=/^https?:$/.test(location.protocol);
 const standalone=!!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches),on=r.on&&perm==='granted';
 let h='<div class="panel"><h3>App, reminders and calendar</h3><h4>Install as an app</h4>';
 h+=standalone?'<p class="small">Running as an installed app.</p>':(xInstallEvt?xBtn({a:'x-install',label:'Install the app'}):'<p class="small">'+(hosted?'If no install button shows here, use your browser menu: "Install app" in Chrome or Edge, or Share, then "Add to Home Screen" in Safari on iPhone.':'Installing needs the dashboard hosted on a web address (for example GitHub Pages or Netlify) together with manifest.webmanifest, sw.js and the two icons. Opened as a file, it cannot be installed.')+'</p>');
 h+='<h4>Reminders on this device</h4><p class="small muted">'+(perm==='unsupported'?'This browser does not support notifications.':'Reminders are '+(on?'on':'off')+'. You get one before each planner block and one at 9:30 pm if the day is not logged. They only fire while the app is open or recently used, so for reminders you can rely on, add the plan to your calendar below.')+'</p>';
 if(perm!=='unsupported')h+='<div class="fx-btns">'+xBtn({a:'x-remind',label:on?'Turn reminders off':'Turn reminders on',ghost:on})+'<label class="small" style="display:flex;gap:6px;align-items:center;">Minutes before a block <select data-action="x-lead" aria-label="Minutes before a block">'+opts(['5','10','15','30'],String(num(r.lead)||10))+'</select></label></div>';
 h+='<h4>Add the plan to your calendar</h4><p class="small muted">Downloads an .ics file with every planner block, its checklist and a reminder. Import it into a separate Google Calendar called "CAT plan" (Settings, Import and export), so you can delete and re-import it in one go if you push a day.</p><div class="fx-btns">'+xBtn({a:'x-ics',label:'Next 4 weeks',data:{w:4}})+xBtn({a:'x-ics',label:'The whole plan',ghost:1,data:{w:0}})+'</div></div>';
 return h;
}
const _xData=renderData;
renderData=function(){const a='<form class="panel" data-form="sync">',h=_xData();return h.indexOf(a)>=0?h.replace(a,xAppPanel()+a):h+xAppPanel();};

// ---------- photos load after each render ----------
const _xRender=render;render=function(){_xRender();xHydrate();};

// ---------- exports ----------
const _xTables=extraTables;
extraTables=function(T){
 _xTables(T);
 const ci=[['Date','Mood','Energy','Screen time min']];
 Object.keys(state.daily).sort().forEach(d=>{const e=state.daily[d];if(e.mood!=null||e.energy!=null||e.screen!=null)ci.push([d,e.mood==null?'':e.mood,e.energy==null?'':e.energy,e.screen==null?'':e.screen]);});
 T['Check-ins']=ci;
 const pp=[['Paper','Date','VARC','DILR','QA','Total','Est. percentile']];
 xPapers().forEach(p=>{const r=state.extra.pyq[p.id];if(r&&r.date){const tt=num(r.v)+num(r.d)+num(r.q),pc=xPct('overall',tt);pp.push([p.name,r.date,r.v==null?'':r.v,r.d==null?'':r.d,r.q==null?'':r.q,tt,pc==null?'':Math.round(pc*10)/10]);}});
 T['Past Papers']=pp;
 const bb=[['Boss','Goal','By','Coins','Defeated']];xBosses().forEach(b=>bb.push([b.name,b.desc,b.date,b.coins,!!b.beaten]));T['Bosses']=bb;
 const qr=[['Quarter','From','To','Goal 1','Score','Goal 2','Score','Goal 3','Score','Keep','Stop','Change']];
 xQuarters().forEach(q=>{const r=state.extra.quarters[q.i];if(!r)return;const g=r.goals||[],c=i=>[(g[i]||{}).t||'',(g[i]||{}).s==null?'':g[i].s];qr.push(['Q'+(q.i+1),q.from,q.to].concat(c(0),c(1),c(2),[r.keep||'',r.drop||'',r.change||'']));});
 T['Quarterly Reviews']=qr;
 const it=[['Trigger','If','Then']];state.extra.ifthen.forEach(p=>it.push([p.trigger,p.ifText,p.thenText]));T['If-Then Plans']=it;
 return T;
};

// ---------- forms ----------
const xClean=(s,w)=>String(s||'').trim().replace(new RegExp('^'+w+'\\s+','i'),'').replace(/[.,]\s*$/,'');
Object.assign(handlers,{
 async 'x-ifthen'(fd){state.extra.ifthen.push({id:uid(),trigger:fd.get('trigger')||'Any',ifText:xClean(fd.get('if'),'if'),thenText:xClean(fd.get('then'),'then')});await save('extra');render();toast('Plan added');},
 async 'x-partner'(fd){state.extra.partner=String(fd.get('partner')||'').replace(/[^\d]/g,'');await save('extra');render();toast(state.extra.partner?'Number saved':'Number cleared');},
 async 'x-calc'(fd){ui.xCalc={v:numOrNull(fd.get('v')),d:numOrNull(fd.get('d')),q:numOrNull(fd.get('q'))};render();},
 async 'x-pcttable'(fd){let bad=0;Object.keys(X_PCT_DEFAULT).forEach(k=>{const v=String(fd.get(k)||'').trim();if(xParseTable(v).length>=2)state.extra.pct[k]=v;else bad++;});await save('extra');render();toast(bad?'Saved. '+bad+' table'+(bad===1?'':'s')+' kept the old values because they could not be read.':'Tables saved');},
 async 'x-pyq'(fd,f){state.extra.pyq[f.dataset.id]={date:fd.get('date')||todayISO(),v:numOrNull(fd.get('v')),d:numOrNull(fd.get('d')),q:numOrNull(fd.get('q'))};await save('extra');render();toast('Paper saved');},
 async 'x-pyq-add'(fd){const name=String(fd.get('name')||'').trim();if(!name)return;state.extra.pyqCustom.push({id:'c'+uid(),name,year:parseInt(fd.get('year'),10)||new Date().getFullYear()});await save('extra');render();toast('Paper added');},
 async 'x-boss'(fd,f){const b=xBosses().find(x=>x.id===f.dataset.id),v=numOrNull(fd.get('score'));if(!b||v==null)return;state.extra.boss[b.id]={score:clamp(v,0,b.max),date:todayISO()};await save('extra');render();if(v<14)toast('Saved. '+b.name+' survives this time: you need 14.');},
 async 'x-quarter'(fd,f){state.extra.quarters[f.dataset.q]={goals:[0,1,2].map(i=>{const s=numOrNull(fd.get('s'+i));return {t:String(fd.get('g'+i)||'').trim(),s:s==null?null:clamp(s,0,10)};}),keep:String(fd.get('keep')||'').trim(),drop:String(fd.get('drop')||'').trim(),change:String(fd.get('change')||'').trim()};await save('extra');render();toast('Quarterly review saved');},
 async 'x-photo'(fd){
  const file=fd.get('file');if(!file||!file.size){alert('Choose a photo first.');return;}
  let blob;try{blob=await xResize(file);}catch(e){alert('That image could not be read. Try a JPEG or PNG.');return;}
  const id='ph-'+uid();try{await idbPut(id,blob);}catch(e){alert('This browser could not store the photo.');return;}
  const pose=fd.get('pose')||'Front';state.extra.photos.push({id,date:fd.get('date')||todayISO(),pose,size:blob.size});ui.xPose=pose;ui.xPhB=id;
  await save('extra');render();toast('Photo saved ('+fmtSize(blob.size)+')');
 }
});

// ---------- buttons and selects ----------
Object.assign(extraClick,{
 'x-refresh':async()=>{render();},
 'x-start':async el=>{xStartTimer(el.dataset.mode,num(el.dataset.mins),el.dataset.pk);},
 'x-tick':async el=>{state.plannerDone[el.dataset.pk]=1;await save('plannerDone');render();toast('Step ticked');},
 'x-cat':async el=>{ui.tab='cat';ui.catTab=el.dataset.tab;render();window.scrollTo(0,0);},
 'x-month':async el=>{ui.tab='month';ui.monthTab=el.dataset.tab;render();window.scrollTo(0,0);},
 'x-push':async el=>{const D=el.dataset.d;if(!confirm('Push '+fmtLong(D)+' to the next day? The rest of this week shifts by a day and Friday\'s revision folds into Saturday.'))return;await xChangeShifts(()=>{state.extra.plShifts.push(D);});toast('Week rescheduled');},
 'x-unpush':async el=>{const D=el.dataset.d;await xChangeShifts(()=>{state.extra.plShifts=state.extra.plShifts.filter(x=>x!==D);});toast('Push undone');},
 'x-if-del':async el=>{state.extra.ifthen=state.extra.ifthen.filter(x=>x.id!==el.dataset.id);await save('extra');render();},
 'x-wa':async el=>{const n=state.extra.partner||'',url='https://wa.me/'+n+'?text='+encodeURIComponent(xWaText(el.dataset.ws));const w=window.open(url,'_blank');if(w)w.opener=null;else toast('Your browser blocked the pop-up. Allow pop-ups for this page and try again.');},
 'x-print-week':async el=>{xPrintWeek(el.dataset.ws);},
 'x-pct-reset':async()=>{if(!confirm('Reset all four tables to the defaults?'))return;state.extra.pct=Object.assign({},X_PCT_DEFAULT);await save('extra');render();},
 'x-pyq-clear':async el=>{if(!confirm('Clear this attempt?'))return;delete state.extra.pyq[el.dataset.id];await save('extra');render();},
 'x-pyq-del':async el=>{if(!confirm('Delete this paper?'))return;state.extra.pyqCustom=state.extra.pyqCustom.filter(p=>p.id!==el.dataset.id);delete state.extra.pyq[el.dataset.id];await save('extra');render();},
 'x-boss-clear':async el=>{delete state.extra.boss[el.dataset.id];await save('extra');render();},
 'x-pose':async el=>{ui.xPose=el.dataset.p;ui.xPhA=null;ui.xPhB=null;render();},
 'x-ph-del':async el=>{if(!confirm('Delete this photo?'))return;const id=el.dataset.id;state.extra.photos=state.extra.photos.filter(p=>p.id!==id);await idbDel(id);await save('extra');render();},
 'x-install':async()=>{if(!xInstallEvt)return;xInstallEvt.prompt();try{await xInstallEvt.userChoice;}catch(e){}xInstallEvt=null;render();},
 'x-remind':async()=>{
  const r=state.extra.remind;
  if(r.on&&Notification.permission==='granted'){r.on=false;await save('extra');render();return;}
  let p=Notification.permission;if(p!=='granted'){try{p=await Notification.requestPermission();}catch(e){}}
  if(p!=='granted'){alert('Notifications are blocked for this page. Allow them in your browser\'s site settings, then try again.');return;}
  r.on=true;await save('extra');render();xNotify('Reminders are on','You will get a nudge before each planner block.');
 },
 'x-ics':async el=>{const w=num(el.dataset.w);downloadBlob(new Blob([xIcs(w)],{type:'text/calendar;charset=utf-8'}),'cat-plan-'+(w?'next-'+w+'-weeks':'all')+'.ics');toast('Calendar file downloaded');}
});
Object.assign(extraChange,{
 'x-q':async el=>{ui.xQ=parseInt(el.value,10);render();},
 'x-ph-sel':async el=>{if(el.dataset.w==='a')ui.xPhA=el.value;else ui.xPhB=el.value;render();},
 'x-lead':async el=>{state.extra.remind.lead=parseInt(el.value,10)||10;await save('extra');}
});
