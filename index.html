<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT 2027 Dashboard and Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#edf0f5; --surface:#ffffff; --ink:#14213d; --muted:#586178; --line:#d3d9e6;
  --cobalt:#2f4fe0; --cobalt-soft:#e4e9fd; --on-cobalt:#ffffff; --gold:#e9a100; --gold-soft:#fcf1d3; --gold-ink:#a97300; --warn-ink:#7a5600;
  --sage:#2e8b6a; --sage-soft:#ddf0e8; --rose:#c8453b; --rose-soft:#f9e1de;
  --field:#f7f8fb; --bar:#e6eaf3; --row:#eef1f8; --hero:#14213d;
  --info-line:#c3cdf7; --warn-line:#efc1bc; --good-line:#bfe0d2;
  --h0:#e3e8f2; --h1:#c3cdfa; --h2:#93a5f3; --h3:#5a78ea; --h4:#e9a100;
}
:root[data-theme="dark"]{
  --paper:#0e1322; --surface:#161c31; --ink:#e8ecf8; --muted:#9aa4c0; --line:#283152;
  --cobalt:#8095ff; --cobalt-soft:#222b58; --on-cobalt:#0e1322; --gold:#f0b429; --gold-soft:#3a2f12; --gold-ink:#f0b429; --warn-ink:#f0b429;
  --sage:#4cc09a; --sage-soft:#15372d; --rose:#ff7b70; --rose-soft:#3d1f1f;
  --field:#1d2440; --bar:#262f50; --row:#212a49; --hero:#1a2347;
  --info-line:#34407a; --warn-line:#6b3a37; --good-line:#25584a;
  --h0:#1f2745; --h1:#2c3a7a; --h2:#4458b8; --h3:#6b85f5; --h4:#f0b429;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1322; --surface:#161c31; --ink:#e8ecf8; --muted:#9aa4c0; --line:#283152;
    --cobalt:#8095ff; --cobalt-soft:#222b58; --on-cobalt:#0e1322; --gold:#f0b429; --gold-soft:#3a2f12; --gold-ink:#f0b429; --warn-ink:#f0b429;
    --sage:#4cc09a; --sage-soft:#15372d; --rose:#ff7b70; --rose-soft:#3d1f1f;
    --field:#1d2440; --bar:#262f50; --row:#212a49; --hero:#1a2347;
    --info-line:#34407a; --warn-line:#6b3a37; --good-line:#25584a;
    --h0:#1f2745; --h1:#2c3a7a; --h2:#4458b8; --h3:#6b85f5; --h4:#f0b429;
  }
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 100px;}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Public Sans',sans-serif;margin:0;font-weight:700;letter-spacing:-0.01em;}
h3{font-size:18px;margin-bottom:12px;}
h4{font-size:15px;margin:14px 0 8px;}
p{margin:0 0 8px;}
.muted{color:var(--muted);}
.small{font-size:13px;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;}

.hero{background:var(--hero);color:#fff;border-radius:16px;padding:22px 24px 18px;margin-bottom:14px;}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;}
.count-num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:84px;line-height:0.9;color:var(--gold);}
.count-label{display:block;font-size:15px;margin-top:6px;color:#c9d0e4;}
.hero-side{font-size:14.5px;color:#dfe4f3;}
.hero-side .day{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-side p{margin-bottom:4px;}
.timeline{margin-top:16px;height:8px;border-radius:999px;background:#2b3a62;position:relative;}
.timeline-fill{height:100%;border-radius:999px;background:var(--gold);}
.timeline-ends{display:flex;justify-content:space-between;font-size:12px;color:#aeb7d2;margin-top:6px;}
@media (max-width:640px){.hero-grid{grid-template-columns:1fr;gap:14px;}.count-num{font-size:68px;}}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin;}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--cobalt);font-weight:600;}
.tab.theme{margin-left:auto;font-size:13px;}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.subtab{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;color:var(--muted);}
.subtab.active{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt);}

.grid-2{display:grid;grid-template-columns:1.1fr 0.9fr;gap:16px;align-items:start;}
.grid-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media (max-width:800px){.grid-2,.grid-eq{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.panel.flush{padding:0;overflow:hidden;}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14.5px;}
.banner.info{background:var(--cobalt-soft);border:1px solid var(--info-line);}
.banner.warn{background:var(--rose-soft);border:1px solid var(--warn-line);}
.banner.good{background:var(--sage-soft);border:1px solid var(--good-line);}
.link{background:none;border:none;color:var(--cobalt);text-decoration:underline;cursor:pointer;padding:0;}
.pausebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}

label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
.field{margin-bottom:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:520px){.row4{grid-template-columns:1fr 1fr;}.row3{grid-template-columns:1fr 1fr;}}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
textarea{resize:vertical;min-height:52px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{position:relative;}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;}
.chip span{display:block;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;font-size:14px;}
.chip input:checked + span{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600;}
.chip input:focus-visible + span{outline:3px solid var(--cobalt);outline-offset:2px;}
.chip.soft input:checked + span{background:var(--gold-soft);border-color:var(--gold);color:var(--warn-ink);}
.btn{background:var(--cobalt);color:var(--on-cobalt);border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;}
.btn.block{width:100%;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;}
.btn.small{padding:6px 10px;font-size:13px;}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--warn-line);}
.del{background:none;border:none;color:var(--rose);cursor:pointer;font-size:13px;padding:2px 4px;}
.edit{background:none;border:none;color:var(--cobalt);cursor:pointer;font-size:13px;padding:2px 4px;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-grid.four{grid-template-columns:repeat(4,1fr);}
@media (max-width:620px){.stat-grid,.stat-grid.four{grid-template-columns:1fr 1fr;}}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;line-height:1.15;}
.stat span{font-size:12.5px;color:var(--muted);}
.stat.gold b{color:var(--gold-ink);}

.bar{height:8px;background:var(--bar);border-radius:999px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--cobalt);}
.bar.sage>i{background:var(--sage);}
.barrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px;}
.barrow .v{text-align:right;color:var(--muted);font-size:13px;}

.streaks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.streak{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.streak b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;color:var(--gold-ink);}
.streak span{font-size:13px;}
.streak small{color:var(--muted);font-size:12px;display:block;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--field);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
.scroll{overflow-x:auto;}
.scroll.tall{max-height:340px;overflow-y:auto;}
.clip{max-width:220px;}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--row);color:var(--muted);}
.tag.good{background:var(--sage-soft);color:var(--sage);}
.tag.warn{background:var(--gold-soft);color:var(--warn-ink);}
.tag.bad{background:var(--rose-soft);color:var(--rose);}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:14px;}

details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface);}
details.sec>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
details.sec>summary::-webkit-details-marker{display:none;}
.chap{padding:4px 16px 12px;}
.chap h4{display:flex;justify-content:space-between;gap:8px;align-items:center;}
.topic{display:grid;grid-template-columns:1fr 140px 28px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--row);font-size:14px;}
@media (max-width:520px){.topic{grid-template-columns:1fr 120px 24px;}}
.topic select{padding:5px 8px;font-size:13px;}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.badge{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);background:var(--field);}
.badge.earned{border:1px solid var(--sage);background:var(--sage-soft);color:var(--ink);}
.badge b{display:block;font-size:13px;}
.reward{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.reward.ready{border-color:var(--gold);background:var(--gold-soft);}
.reward.claimed{background:var(--row);color:var(--muted);}

.ringwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.ring{width:140px;height:140px;flex:none;}
.rg-bg{stroke:var(--bar);} .rg-m{stroke:var(--sage);} .rg-r{stroke:var(--cobalt);} .rg-l{stroke:var(--gold);}
.ring-num{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;fill:var(--ink);}
.ring-sub{font-size:10px;fill:var(--muted);}
.chart{width:100%;height:auto;display:block;}
.ch-grid{stroke:var(--line);stroke-width:1;} .ch-txt{fill:var(--muted);font-size:11px;}
.ch-line{stroke:var(--cobalt);stroke-width:2.5;stroke-linejoin:round;}
.ch-dot{fill:var(--surface);stroke:var(--cobalt);stroke-width:2.5;}
.ch-target{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4;}

.heatwrap{width:max-content;padding-bottom:4px;}
.heatmonths{display:grid;grid-template-columns:repeat(53,12px);gap:2px;font-size:11px;color:var(--muted);height:16px;margin-bottom:4px;}
.heatmonths span{white-space:nowrap;overflow:visible;}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:2px;}
.cell{width:12px;height:12px;border-radius:3px;border:none;padding:0;display:block;background:var(--h0);}
button.cell{cursor:pointer;}
.cell.h1{background:var(--h1);} .cell.h2{background:var(--h2);} .cell.h3{background:var(--h3);} .cell.h4{background:var(--h4);}
.cell.pre{background:transparent;opacity:.35;border:1px dashed var(--line);}
.cell.fut{background:transparent;border:1px dashed var(--line);}
.cell.pz{background:repeating-linear-gradient(45deg,var(--line),var(--line) 2px,transparent 2px,transparent 4px);}
.cell.today{outline:2px solid var(--ink);outline-offset:1px;}
.legend{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.legend i.cell{display:inline-block;}

.timer-big{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;font-weight:700;line-height:1;margin:6px 0 8px;}
.duerow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--row);padding:8px 0;font-size:14px;}
.recap{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:inherit;font-size:13.5px;margin:0 0 10px;}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--hero);color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:50;max-width:92vw;}
.toast.show{display:block;}
.timerbar{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--hero);color:#fff;border:1px solid var(--line);padding:8px 10px 8px 16px;border-radius:999px;display:flex;gap:10px;align-items:center;z-index:45;font-size:14px;white-space:nowrap;}
.timerbar button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;}
.celebrate{position:fixed;inset:0;display:grid;place-items:start center;padding-top:14vh;z-index:60;pointer-events:none;}
.cel-card{pointer-events:auto;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:20px 26px;max-width:min(420px,90vw);box-shadow:0 12px 40px rgba(0,0,0,.28);text-align:center;}
.cel-card h3{margin-bottom:8px;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;}
.loading{text-align:center;padding:80px 20px;color:var(--muted);}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;}}
.sc-v{fill:var(--cobalt);fill-opacity:.8;} .sc-d{fill:var(--gold);fill-opacity:.85;} .sc-q{fill:var(--sage);fill-opacity:.85;}
i.lg-v,i.lg-d,i.lg-q{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;}
i.lg-v{background:var(--cobalt);} i.lg-d{background:var(--gold);} i.lg-q{background:var(--sage);}
.bar-r{fill:var(--cobalt);}
.tl-1{stroke:var(--cobalt);stroke-width:2.5;stroke-linejoin:round;} .tl-2{stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;}
.td-raw{fill:var(--muted);fill-opacity:.55;}
.subtabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;padding-bottom:4px;} .subtab{white-space:nowrap;}
@media print{
  body.print-report .hero,body.print-report .tabs,body.print-report .subtabs,body.print-report .panel:not(.printme),body.print-report #timerbar,body.print-report #toast,body.print-report #celebrate,body.print-report .printme button{display:none!important;}
  body.print-report{background:#fff;color:#000;} body.print-report .printme{border:none;} body.print-report .recap{border:none;background:#fff;color:#000;font-size:14px;}
}

.pl-month{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}.pl-month h2{font-size:21px}
details.pday{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
details.pday.today{border:2px solid var(--cobalt)} details.pday.done{opacity:.72}
details.pday>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:10px 14px}
details.pday>summary::-webkit-details-marker{display:none}
.pdd{font-weight:600}.pdd small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ptt{font-weight:500}.ptt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.prt{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ppr{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pbody{padding:2px 16px 14px;border-top:1px solid var(--line)}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}
.plk label{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--bar);align-items:start}
.plk label:first-child{border-top:none}.plk .m{color:var(--muted);font-size:12.5px;white-space:nowrap}
.plk input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--cobalt)}
.pnote{background:var(--field);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.pnote.gold{background:var(--gold-soft)}
@media (max-width:640px){details.pday>summary{grid-template-columns:70px 1fr}.prt{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading your dashboard…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="timerbar" class="timerbar" hidden></div>
<div id="celebrate" class="celebrate" hidden></div>
<script>
(function(){
'use strict';

const NS='lifecat';
const KEYS=['meta','daily','weekly','syllabus','mocks','errors','reading','content','courses','rewards','monthly','pauses','resources','mockPlan','cards','posts','scripts','fund','lifts','dilr','rc','stories','schools','monthNotes','plannerDone'];
const DEFAULT_START='2026-10-19';   // Monday, Day 1
const OLD_STARTS=['2026-10-12','2026-10-15'];
const DEFAULT_CAT='2027-11-28';     // last Sunday of November 2027 (assumed, editable in Data)
const TOTAL_DAYS=365;
const POINTS_PER_LEVEL=500;
const MAX_DAY_POINTS=70;

const HABITS=[
  {key:'doomFree',label:'Doomscroll-free',pts:10},
  {key:'deepWork',label:'Deep work',pts:15},
  {key:'reading',label:'Reading',pts:10},
  {key:'catBlock',label:'CAT or skill block',pts:15},
  {key:'hobby',label:'Hobby',pts:10},
  {key:'workout',label:'Workout',pts:10}
];
const STREAK_KEYS=HABITS.concat([{key:'showedUp',label:'Showed up (any habit or a minimum viable day)',pts:0}]);
const TIERS=[7,30,100];
const SECTION_NAMES={QA:'Quantitative Ability',DILR:'Data Interpretation and Logical Reasoning',VARC:'Verbal Ability and Reading Comprehension'};
const STATUSES=['Not started','Learning','Revising','Mastered'];
const MISTAKES=['Concept gap','Silly error','Time pressure','Misread'];
const CONTENT_STATUS=['Watched','Drafted','Posted'];
const HOBBY_TYPES=['Photography','Writing','Blog or Instagram','Film'];

const SYLLABUS_SEED={
  QA:{
    'Arithmetic':['Percentages','Profit, loss and discount','Ratio, proportion and variation','Simple and compound interest','Time, speed and distance','Time and work','Mixtures and alligations','Averages'],
    'Algebra':['Linear equations','Quadratic equations','Inequalities and modulus','Functions and graphs','Progressions','Logarithms','Surds and indices'],
    'Geometry and mensuration':['Lines, angles and triangles','Circles','Polygons and quadrilaterals','Coordinate geometry','Mensuration (2D and 3D)','Trigonometry basics'],
    'Number system':['Factors, HCF and LCM','Divisibility and remainders','Base systems','Number properties'],
    'Modern math':['Permutation and combination','Probability','Set theory and Venn diagrams']
  },
  DILR:{
    'Data interpretation':['Tables','Bar and line charts','Pie charts','Caselets','Mixed charts'],
    'Logical reasoning':['Arrangements','Games and tournaments','Networks and routes','Puzzles and selections','Binary logic','Set-based Venn sets']
  },
  VARC:{
    'Reading comprehension':['Inference-based passages','Author tone and purpose','Reading speed and retention'],
    'Verbal ability':['Para jumbles','Para summary','Odd one out','Sentence insertion']
  }
};
const DEFAULT_COURSES=[
  {id:'k1',name:'Excel (Kyle Pew or XelPlus)',q:1,progress:0},
  {id:'k2',name:'SQL (SQLBolt or DataCamp)',q:1,progress:0},
  {id:'k3',name:'Photography fundamentals',q:1,progress:0},
  {id:'k4',name:'System design (ByteByteGo or Exponent)',q:2,progress:0},
  {id:'k5',name:'Public speaking (Toastmasters)',q:2,progress:0},
  {id:'k6',name:'Business fundamentals reading',q:3,progress:0},
  {id:'k7',name:'Screenwriting (Sundance Collab)',q:3,progress:0}
];
const DEFAULT_REWARDS=[
  {id:'r1',name:'Movie night out',type:'points',points:500,badgeId:'',claimed:false},

// ---------- storage (Claude viewer if present, otherwise this browser) ----------
function hasClaudeStorage(){return typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';}
const localBackend={
  get(key){return new Promise(res=>{try{const raw=window.localStorage.getItem(NS+'::'+key);res(raw===null?null:{key,value:raw});}catch(e){res(null);}});},
  set(key,value){return new Promise((res,rej)=>{try{window.localStorage.setItem(NS+'::'+key,value);res({key,value});}catch(e){rej(e);}});}
};
const storageAPI=hasClaudeStorage()?window.storage:localBackend;

// ---------- state ----------
let state={meta:{startDate:DEFAULT_START,catDate:DEFAULT_CAT},daily:{},weekly:{},syllabus:null,mocks:[],errors:[],reading:[],content:[],courses:null,rewards:null,monthly:{},pauses:{},resources:[],mockPlan:[],cards:[],posts:[],scripts:[],fund:null,lifts:[],dilr:[],rc:[],stories:[],schools:[],monthNotes:{},plannerDone:{}};

// ---------- helpers ----------
const app=()=>document.getElementById('app');
const paused=d=>!!(state.pauses&&state.pauses[d]);
const pad=n=>n<10?'0'+n:''+n;
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return iso(new Date());}
function parse(s){return new Date(s+'T00:00:00');}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function mondayOf(s){const d=parse(s);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return iso(d);}
function fmtShort(s){return parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fmtLong(s){return parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(x){const n=parseFloat(x);return isNaN(n)?0:n;}
function numOrNull(x){if(x===''||x==null)return null;const n=parseFloat(x);return isNaN(n)?null:n;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function avg(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;}
function r1(n){return n==null?'-':(Math.round(n*10)/10).toString();}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function opts(list,sel,blank){return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(v=>{const val=Array.isArray(v)?v[0]:v;const lab=Array.isArray(v)?v[1]:v;return '<option value="'+esc(val)+'"'+(String(sel)===String(val)?' selected':'')+'>'+esc(lab)+'</option>';}).join('');}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},2200);}

async function save(k){try{await storageAPI.set(NS+'-'+k,JSON.stringify(state[k]),false);}catch(e){toast('Could not save. Export a backup and check your browser storage settings.');}
  try{scheduleSync();}catch(e){}}
async function saveAll(){for(const k of KEYS){await save(k);}}
async function loadAll(){
  for(const k of KEYS){
    try{const r=await storageAPI.get(NS+'-'+k,false);if(r&&r.value!=null)state[k]=JSON.parse(r.value);}catch(e){}
  }
  let seeded=false;
  if(!Array.isArray(state.syllabus)){state.syllabus=buildSyllabus();seeded=true;}
  if(!Array.isArray(state.courses)){state.courses=DEFAULT_COURSES.map(c=>Object.assign({},c));seeded=true;}
  if(!Array.isArray(state.rewards)){state.rewards=DEFAULT_REWARDS.map(r=>Object.assign({},r));seeded=true;}
  if(!state.meta||!state.meta.startDate){state.meta={startDate:DEFAULT_START,catDate:DEFAULT_CAT};seeded=true;}
  if(!state.meta.catDate){state.meta.catDate=DEFAULT_CAT;seeded=true;}
  if(migrateMeta())seeded=true;
  if(!state.pauses||typeof state.pauses!=='object'||Array.isArray(state.pauses)){state.pauses={};seeded=true;}
  normalizeNew();
  if(seeded)await saveAll();
}
function migrateMeta(){
  if(state.meta&&OLD_STARTS.indexOf(state.meta.startDate)>=0){state.meta.startDate=DEFAULT_START;return true;}
  return false;
}
function buildSyllabus(){
  const out=[];let i=0;
  Object.keys(SYLLABUS_SEED).forEach(sec=>{Object.keys(SYLLABUS_SEED[sec]).forEach(ch=>{SYLLABUS_SEED[sec][ch].forEach(t=>{out.push({id:'t'+(++i),section:sec,chapter:ch,name:t,status:'Not started'});});});});
  return out;
}

// ---------- derived data ----------
function buildCache(){
  readMap={};flagCache={};
  state.reading.forEach(r=>{readMap[r.date]=(readMap[r.date]||0)+num(r.minutes);});
}
function flagsOn(d){
  if(flagCache[d])return flagCache[d];
  const e=state.daily[d]||{};
  const f={
    doomFree:!!e.doomFree,deepWork:!!e.deepWork,
    reading:!!e.reading||(readMap[d]||0)>0,
    catBlock:!!e.catBlock||(num(e.quant)+num(e.dilr)+num(e.varc))>0,
    hobby:!!e.hobby,workout:!!e.workout
  };
  let core=0,all=true;
  HABITS.forEach(h=>{if(f[h.key])core+=h.pts;else all=false;});
  f.mvd=!!e.mvd;
  f.points=core>0?core:(f.mvd?5:0);
  f.perfect=all;
  f.showedUp=core>0||f.mvd;
  f.has=!!state.daily[d]||(readMap[d]||0)>0;
  f.paused=paused(d);
  flagCache[d]=f;
  return f;
}
function allDates(){
  const s=new Set(Object.keys(state.daily));
  Object.keys(readMap).forEach(d=>s.add(d));
  return Array.from(s).sort();
}
function trueDates(key){return allDates().filter(d=>flagsOn(d)[key]);}
function gapPaused(a,b){
  const diff=daysBetween(a,b);
  if(diff<=1)return true;
  for(let k=1;k<diff;k++){if(!paused(addDays(a,k)))return false;}
  return true;
}
function bestStreak(ds){
  if(!ds.length)return 0;
  let best=1,run=1;
  for(let i=1;i<ds.length;i++){run=gapPaused(ds[i-1],ds[i])?run+1:1;if(run>best)best=run;}
  return best;
}
function currentStreak(ds){
  if(!ds.length)return 0;
  const set=new Set(ds);
  let cur=todayISO();
  if(!set.has(cur))cur=addDays(cur,-1);
  let guard=0,n=0;
  while(guard++<4000){
    if(set.has(cur)){n++;cur=addDays(cur,-1);}
    else if(paused(cur)){cur=addDays(cur,-1);}
    else break;
  }
  return n;
}
function computeStreaks(){
  const out={};
  STREAK_KEYS.forEach(h=>{const ds=trueDates(h.key);out[h.key]={current:currentStreak(ds),best:bestStreak(ds),total:ds.length};});
  return out;
}
function totalPoints(){return allDates().reduce((s,d)=>s+flagsOn(d).points,0);}
function hasPerfectWeek(){
  const perfect=new Set(allDates().filter(d=>flagsOn(d).perfect));
  for(const d of perfect){let ok=true;for(let i=1;i<7;i++){if(!perfect.has(addDays(d,-i))){ok=false;break;}}if(ok)return true;}
  return false;
}
function weekDates(ws){return Array.from({length:7},(_,i)=>addDays(ws,i));}
function statsForDates(dates){
  const today=todayISO();
  const st={dates,days:0,elapsed:0,habitDays:{},points:0,sleep:[],stress:[],weight:[],quant:0,dilr:0,varc:0,perfect:0,mvd:0,paused:0};
  HABITS.forEach(h=>{st.habitDays[h.key]=0;});
  dates.forEach(d=>{
    if(d<=today&&d>=state.meta.startDate){if(paused(d))st.paused++;else st.elapsed++;}
    const f=flagsOn(d),e=state.daily[d]||{};
    if(f.has)st.days++;
    HABITS.forEach(h=>{if(f[h.key])st.habitDays[h.key]++;});
    st.points+=f.points;if(f.perfect)st.perfect++;if(f.mvd)st.mvd++;
    if(num(e.sleep)>0)st.sleep.push(num(e.sleep));
    if(num(e.stress)>0)st.stress.push(num(e.stress));
    if(num(e.weight)>0)st.weight.push(num(e.weight));
    st.quant+=num(e.quant);st.dilr+=num(e.dilr);st.varc+=num(e.varc);
  });
  st.avgSleep=avg(st.sleep);st.avgStress=avg(st.stress);st.avgWeight=avg(st.weight);
  st.catTotal=st.quant+st.dilr+st.varc;
  st.consistency=st.elapsed?Math.round(st.points/(st.elapsed*MAX_DAY_POINTS)*100):0;
  st.allPaused=st.elapsed===0&&st.paused>0;
  st.recovery=(st.avgSleep!==null&&st.avgSleep<6)||(st.avgStress!==null&&st.avgStress>=4);
  st.neglected=[];
  if(st.catTotal>=120){[['quant','Quant'],['dilr','DILR'],['varc','VARC']].forEach(p=>{if(st[p[0]]/st.catTotal<0.2)st.neglected.push(p[1]);});}
  return st;
}
function suggestDecision(ws){
  const st=statsForDates(weekDates(ws));
  if(st.allPaused)return {label:'Hold',text:'A paused week. Hold everything and ease back in gently.'};
  if(st.recovery)return {label:'Reduce',text:'Sleep or stress is outside a workable range. Protect sleep first, drop your lowest-priority block, and keep CAT and training.'};
  if(st.days<4)return {label:'Hold',text:'Fewer than 4 days logged, so there is not enough data to change anything.'};
  const prev=[1,2].map(i=>statsForDates(weekDates(addDays(ws,-7*i))));
  if(st.consistency>=80&&prev.every(p=>p.consistency>=80&&p.days>=4))return {label:'Increase',text:'Three weeks in a row at 80% or more. You can add a little, for example 15 more minutes of CAT a day.'};
  if(st.consistency<50)return {label:'Reduce',text:'Under half of the possible points. Cut the lowest-priority block for a week instead of pushing harder.'};
  return {label:'Hold',text:'Steady week. Keep the plan as it is and read the trend, not one day.'};
}
function phaseOn(d){
  const s=state.meta.startDate,c=state.meta.catDate;
  if(d<s)return {cat:'Starts on '+fmtLong(s),other:''};
  if(d>c)return {cat:'The exam date has passed. Review your result and plan the next step.',other:''};
  const idx=daysBetween(s,d);
  let cat;
  if(idx<90)cat='Foundation: Quant basics, daily reading, habit setup';
  else if(idx<planSettings().cw*7)cat='Concepts: work through the whole syllabus, start light DILR';
  else if(d<addDays(c,-88))cat='Practice: sectionals, topic tests and error review';
  else cat='Mock sprint: full mocks, analysis and error log';
  const q=Math.floor(idx/91);
  const others=['Excel and SQL in short sessions, photography basics, start the SIP','System design, public speaking, launch the blog or Instagram page','Business fundamentals reading, script writing','First short film shoot, monetization groundwork'];
  return {cat,other:q>3?'Keep the habits going and taper other skills':others[q]};
}
function chapterList(){
  const map={};
  state.syllabus.forEach(t=>{
    const k=t.section+'||'+t.chapter;
    if(!map[k])map[k]={section:t.section,chapter:t.chapter,total:0,mastered:0};
    map[k].total++;if(t.status==='Mastered')map[k].mastered++;
  });
  return Object.keys(map).map(k=>map[k]);
}
function syllabusCoverage(){
  const total=state.syllabus.length;
  const counts={};STATUSES.forEach(s=>{counts[s]=0;});
  state.syllabus.forEach(t=>{counts[t.status]=(counts[t.status]||0)+1;});
  return {total,counts,mastered:counts['Mastered'],pct:total?Math.round(counts['Mastered']/total*100):0};
}
function computeBadges(streaks){
  const out=[];
  const cov=syllabusCoverage();

  out.push({id:'ten-mocks',group:'Milestones',label:'Ten mocks logged',earned:mockN>=10});
  out.push({id:'chapter',group:'Milestones',label:'First syllabus chapter mastered',earned:chaptersDone>=1});
  out.push({id:'syl-25',group:'Milestones',label:'Syllabus 25% mastered',earned:cov.pct>=25});
  out.push({id:'syl-50',group:'Milestones',label:'Syllabus 50% mastered',earned:cov.pct>=50});
  out.push({id:'syl-75',group:'Milestones',label:'Syllabus 75% mastered',earned:cov.pct>=75});
  out.push({id:'errors-10',group:'Milestones',label:'10 errors revised',earned:revised>=10});
  out.push({id:'perfect-week',group:'Milestones',label:'Perfect week',earned:hasPerfectWeek()});
  out.push({id:'read-30',group:'Milestones',label:'30 reading days',earned:readDays>=30});
  out.push({id:'course',group:'Milestones',label:'First course finished',earned:courseDone});
  out.push({id:'posted',group:'Milestones',label:'First post published',earned:posted>=1});
  out.push({id:'invest-3',group:'Milestones',label:'3 months of SIP and vacation fund',earned:finMonths>=3});
  STREAK_KEYS.forEach(h=>{TIERS.forEach(t=>{
    out.push({id:h.key+'-'+t,group:'Streaks',label:t+'-day streak: '+(h.key==='showedUp'?'showing up':h.label.toLowerCase()),earned:streaks[h.key].best>=t});
  });});
  return out;
}
function rewardState(r,pts,badgeMap){
  const unlocked=r.type==='points'?pts>=num(r.points):!!badgeMap[r.badgeId];
  return r.claimed?'claimed':(unlocked?'ready':'locked');
}

const REV_GAPS=[1,3,7,14];
function nextDue(x){return addDays(x.lastRev||x.date,REV_GAPS[Math.min(num(x.rev),3)]);}
function errorsDue(){const t=todayISO();return state.errors.filter(x=>!x.revised&&nextDue(x)<=t).sort((a,b)=>nextDue(a)<nextDue(b)?-1:1);}
function exportDates(){const s=new Set(allDates());Object.keys(state.pauses).forEach(d=>s.add(d));return Array.from(s).sort();}

function planCard(){
  const today=todayISO();
  if(paused(today))return '<div class="panel"><h3>Today\'s plan</h3><p class="muted">You paused today. Nothing is due and your streaks are safe. Rest up.</p></div>';
  const last7=statsForDates(Array.from({length:7},(_,i)=>addDays(today,-6+i)));
  const idx=daysBetween(state.meta.startDate,today);
  const foundation=idx<90;
  const cands=[['QA','quant','Quant'],['DILR','dilr','DILR'],['VARC','varc','VARC']].filter(c=>!(foundation&&c[0]==='DILR'));
  cands.sort((a,b)=>last7[a[1]]-last7[b[1]]);
  const pick=cands[0];
  const topics=state.syllabus.filter(t=>t.section===pick[0]);
  const t=topics.find(x=>x.status==='Learning')||topics.find(x=>x.status==='Revising')||topics.find(x=>x.status==='Not started');
  const f=flagsOn(today);
  const open=HABITS.filter(hb=>!f[hb.key]);
  const due=errorsDue();
  let h='<div class="panel"><h3>Today\'s plan</h3>';
  h+='<p><strong>CAT focus: '+pick[2]+'.</strong> '+(last7.catTotal?'It has had the least time in the last 7 days ('+last7[pick[1]]+' min).':'No section minutes logged yet this week.')+(t?' Next topic: '+esc(t.name)+' ('+esc(t.status.toLowerCase())+').':'')+'</p>';
  if(foundation)h+='<p class="muted small">DILR joins the plan when the Concepts phase starts.</p>';
  h+='<h4>Errors due for revision ('+due.length+')</h4>';
  if(!due.length)h+='<p class="muted small">Nothing due. New errors come back after 1, 3, 7 and 14 days.</p>';
  else h+=due.slice(0,5).map(x=>'<div class="duerow"><span><strong>'+esc(x.section)+'</strong> '+esc(x.topic)+(x.fix?'<br><span class="muted small">'+esc(x.fix)+'</span>':'')+'</span><button type="button" class="btn ghost small" data-action="rev-pass" data-id="'+x.id+'">Revised</button></div>').join('')+(due.length>5?'<p class="muted small">and '+(due.length-5)+' more in the Error log.</p>':'');
  h+='<h4>Still open today</h4>'+(open.length?'<div class="chips">'+open.map(hb=>'<span class="tag">'+esc(hb.label)+'</span>').join('')+'</div>':'<p class="muted small">Every habit is done. Nice.</p>');
  return h+'</div>';
}

function heatmap(){
  const today=todayISO(),start=state.meta.startDate;
  const first=mondayOf(start),weeks=53;
  let months='',cells='',prevM=-1;
  for(let w=0;w<weeks;w++){
    const mon=addDays(first,w*7);const m=parse(mon).getMonth();
    const showM=m!==prevM&&(w>0||parse(addDays(first,21)).getMonth()===m);
    months+='<span>'+(showM?parse(mon).toLocaleDateString('en-GB',{month:'short'}):'')+'</span>';prevM=m;
    for(let r=0;r<7;r++){
      const d=addDays(mon,r);
      let cls='cell',label=fmtShort(d);
      if(d<start){cls+=' pre';}
      else if(d>today){cls+=' fut';}
      else{
        const f=flagsOn(d);
        if(f.paused&&f.points===0){cls+=' pz';label+=': paused';}
        else{const p=f.points;cls+=' '+(p>=70?'h4':p>=50?'h3':p>=30?'h2':p>0?'h1':'h0');label+=': '+p+' points'+(f.paused?' (paused)':'');}
      }
      if(d===today)cls+=' today';
      cells+=(d>=start&&d<=today)?'<button type="button" class="'+cls+'" data-action="edit-daily" data-date="'+d+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"></button>':'<span class="'+cls+'" title="'+esc(label)+'"></span>';
    }
  }
  return '<div class="panel"><h3>Your year</h3><div class="scroll"><div class="heatwrap"><div class="heatmonths">'+months+'</div><div class="heat">'+cells+'</div></div></div>'+
    '<div class="legend"><span class="muted small">Less</span><i class="cell h0"></i><i class="cell h1"></i><i class="cell h2"></i><i class="cell h3"></i><i class="cell h4"></i><span class="muted small">More</span><i class="cell pz" style="margin-left:10px;"></i><span class="muted small">Paused</span></div></div>';
}

function mockChart(){
  const ms=state.mocks.filter(m=>m.percentile!=null).slice().sort((a,b)=>a.date<b.date?-1:1);
  const head='<div class="panel"><h3>Percentile trend</h3>';
  if(ms.length<2)return head+'<div class="empty">Log at least two mocks with a percentile to see your trend.</div></div>';
  const W=640,H=230,L=38,R=14,T=14,B=36,n=ms.length;
  const vals=ms.map(m=>num(m.percentile));
  const tgt=state.meta.catTarget;
  const lo=Math.max(0,Math.floor((Math.min.apply(null,vals.concat(tgt!=null?[tgt]:[]))-5)/10)*10),hi=100;
  const X=i=>L+(W-L-R)*(i/(n-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Percentile by mock">';
  const step=(hi-lo)>50?20:10;
  for(let v=lo;v<=hi;v+=step){svg+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ch-txt" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';}
  if(tgt!=null)svg+='<line class="ch-target" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tgt)+'" y2="'+Y(tgt)+'"/><text class="ch-txt" x="'+(W-R)+'" y="'+(Y(tgt)-5)+'" text-anchor="end">Target '+tgt+'</text>';
  svg+='<polyline class="ch-line" fill="none" points="'+ms.map((m,i)=>X(i)+','+Y(num(m.percentile))).join(' ')+'"/>';
  ms.forEach((m,i)=>{
    svg+='<circle class="ch-dot" cx="'+X(i)+'" cy="'+Y(num(m.percentile))+'" r="4"><title>'+esc(m.name)+': '+esc(m.percentile)+' percentile ('+esc(fmtShort(m.date))+')</title></circle>';
    if(n<=8||i%2===0)svg+='<text class="ch-txt" x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(fmtShort(m.date))+'</text>';
  });
  return head+svg+'</svg></div>';
}

function ringSvg(cov){
  const r=44,C=2*Math.PI*r,tot=Math.max(1,cov.total);
  let off=0,segs='';
  [['Mastered','rg-m'],['Revising','rg-r'],['Learning','rg-l']].forEach(p=>{
    const len=cov.counts[p[0]]/tot*C;
    if(len>0){segs+='<circle class="'+p[1]+'" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="14" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len;}
  });
  return '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+cov.pct+' percent of the syllabus mastered"><g transform="rotate(-90 60 60)"><circle class="rg-bg" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="14"/>'+segs+'</g><text x="60" y="58" text-anchor="middle" class="ring-num">'+cov.pct+'%</text><text x="60" y="76" text-anchor="middle" class="ring-sub">mastered</text></svg>';
}

function weekRecap(ws){
  const st=statsForDates(weekDates(ws));const we=addDays(ws,6);
  const mm=m=>{const h=Math.floor(m/60),r=m%60;return h?h+'h'+(r?' '+r+'m':''):r+'m';};
  const L=[];
  L.push('Week of '+fmtShort(ws)+' to '+fmtShort(we));
  if(st.allPaused){L.push('Paused week. Everything on hold, streaks protected.');}
  else{
    L.push(st.days+'/7 days logged'+(st.paused?' ('+st.paused+' paused)':'')+', consistency '+st.consistency+'%, '+st.points+' points'+(st.perfect?', '+st.perfect+' perfect day'+(st.perfect===1?'':'s'):''));
    L.push('Habits: '+HABITS.map(h=>h.label.toLowerCase()+' '+st.habitDays[h.key]+'/7').join(', '));
    L.push('CAT time: '+mm(st.catTotal)+(st.catTotal?' (Quant '+mm(st.quant)+', DILR '+mm(st.dilr)+', VARC '+mm(st.varc)+')':''));
  }
  const bits=[];
  if(st.avgSleep!==null)bits.push('sleep '+r1(st.avgSleep)+'h');
  if(st.avgStress!==null)bits.push('stress '+r1(st.avgStress)+'/5');
  if(st.avgWeight!==null)bits.push('weight '+r1(st.avgWeight)+' kg');
  if(bits.length)L.push('Averages: '+bits.join(', ')+(st.recovery?' (recovery week)':''));
  const mocks=state.mocks.filter(m=>m.date>=ws&&m.date<=we);
  if(mocks.length)L.push('Mocks: '+mocks.map(m=>m.name+(m.percentile!=null?' ('+m.percentile+' percentile)':'')).join(', '));
  const errs=state.errors.filter(e=>e.date>=ws&&e.date<=we).length;
  if(errs)L.push('Errors logged: '+errs);
  const rd=state.reading.filter(r=>r.date>=ws&&r.date<=we).reduce((s,r)=>s+num(r.minutes),0);
  if(rd)L.push('Reading: '+mm(rd));
  const r=state.weekly[ws];
  if(r&&r.decision)L.push('Decision: '+r.decision+(r.change?' ('+r.change+')':''));
  if(r&&r.priorities&&r.priorities.some(Boolean))L.push('Next week: '+r.priorities.filter(Boolean).join('; '));
  return L.join('\n');
}

async function logTimer(ms){

let celTimer=null;
function readSeen(){try{return JSON.parse(localStorage.getItem(SEEN_KEY));}catch(e){return null;}}

function confetti(){
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const c=document.createElement('canvas');c.className='confetti';c.width=window.innerWidth;c.height=window.innerHeight;
    const ctx=c.getContext&&c.getContext('2d');if(!ctx)return;
    document.body.appendChild(c);
    const colors=['#2f4fe0','#e9a100','#2e8b6a','#c8453b','#8095ff'];
    const parts=Array.from({length:120},()=>({x:window.innerWidth/2+(Math.random()-.5)*220,y:window.innerHeight*0.3,vx:(Math.random()-.5)*9,vy:Math.random()*-9-2,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*0.3,col:colors[(Math.random()*colors.length)|0]}));
    let t0=null;
    const frame=t=>{
      if(!t0)t0=t;
      ctx.clearRect(0,0,c.width,c.height);
      parts.forEach(p=>{p.vy+=0.25;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});
      if(t-t0<2600)requestAnimationFrame(frame);else c.remove();
    };
    requestAnimationFrame(frame);
  }catch(e){}
}
function celebrate(msgs){
  const el=document.getElementById('celebrate');if(!el)return;
  el.innerHTML='<div class="cel-card" role="alertdialog" aria-label="Celebration"><h3>Nice work</h3>'+msgs.map(m=>'<p>'+esc(m)+'</p>').join('')+'<button type="button" class="btn small" data-action="cel-close">Thanks</button></div>';
  el.hidden=false;
  clearTimeout(celTimer);celTimer=setTimeout(()=>{el.hidden=true;},7000);
  confetti();
}

// ---------- study plan and pace ----------
function planSettings(){
  const s=state.meta.startDate,c=state.meta.catDate;
  const total=Math.max(1,daysBetween(s,c));
  let cw=28;
  if(total<260)cw=Math.max(8,Math.floor((total-100)/7));
  return {s,c,cw,foundationEnd:addDays(s,89),conceptsEnd:addDays(s,cw*7-1),sprintStart:addDays(c,-88)};
}
function buildPlanRows(){
  const ps=planSettings();
  const tracks={QA:[],DILR:[],VARC:[]};
  state.syllabus.forEach(t=>{if(tracks[t.section])tracks[t.section].push(t);});
  const out=[];
  const spread=(list,fromWeek,toWeek)=>{
    const n=list.length,span=Math.max(1,toWeek-fromWeek+1);
    list.forEach((t,i)=>{
      const startWk=fromWeek+Math.min(span-1,Math.floor(i*span/n));
      const endWk=Math.max(startWk,fromWeek+Math.floor((i+1)*span/n)-1);
      out.push({topic:t,section:t.section,startWeek:startWk,endWeek:endWk,due:addDays(ps.s,endWk*7-1)});
    });
  };
  spread(tracks.QA,1,ps.cw);
  spread(tracks.DILR,Math.ceil(ps.cw/2)+1,ps.cw);
  spread(tracks.VARC,1,ps.cw);
  return out;
}
function paceFor(rows,ps){
  const today=todayISO();
  const learned=r=>r.topic.status==='Revising'||r.topic.status==='Mastered';
  const total=rows.length;
  const expected=rows.filter(r=>r.due<=today).length;
  const done=rows.filter(learned).length;
  const mastered=rows.filter(r=>r.topic.status==='Mastered').length;
  const diff=done-expected;
  const status=diff>=2?'Ahead':(diff>=-1?'On track':'Behind');
  const remaining=Math.max(0,total-done);
  const daysLeft=daysBetween(today,ps.conceptsEnd);
  const weeksLeft=Math.max(1,Math.ceil(daysLeft/7));
  return {total,expected,done,mastered,diff,status,remaining,weeksLeft,perWeek:remaining/weeksLeft,late:daysLeft<0&&remaining>0};
}
function paceMessage(p,ps){
  if(!p.total)return 'No topics in this list yet.';
  if(p.remaining===0)return 'All '+p.total+' topics learned. Now it is about mastery and mocks.';
  if(p.late)return p.done+' of '+p.total+' learned and the concepts phase has ended. '+p.remaining+' topics are still open, so finish them first.';
  return p.done+' of '+p.total+' learned ('+p.expected+' were scheduled by now). '+p.remaining+' more needed by '+fmtShort(ps.conceptsEnd)+', about '+(Math.round(p.perWeek*10)/10)+(Math.round(p.perWeek*10)/10===1?' topic':' topics')+' a week.';
}

    {name:'Concepts',from:addDays(ps.foundationEnd,1),to:ps.conceptsEnd,goal:'Finish every Quant topic, learn the DILR set types, keep VARC daily.',weekly:'About 7 sessions: 3 Quant, 2 DILR and 2 VARC.'},
    {name:'Practice',from:addDays(ps.conceptsEnd,1),to:addDays(ps.sprintStart,-1),goal:'Sectionals, topic tests and error review. Fix weak topics from the Error log.',weekly:'2 sectionals, 1 topic test, 1 error-review session, and a full mock every second week.'},
    {name:'Mock sprint',from:ps.sprintStart,to:ps.c,goal:'Weekly full mocks with a proper autopsy, plus light revision of weak topics.',weekly:'1 full mock, 1 autopsy day, 2 sectionals and daily error revision.'}
  ];
  return blocks.filter(b=>b.from<=b.to);
}

// ---------- weak spots ----------
const FIX_TIPS={'Concept gap':'Relearn the idea from your notes or a video, then do 5 fresh problems on it.','Silly error':'Slow down on the last step: re-read what is asked and check units and signs before you answer.','Time pressure':'Do timed sets of 5 and learn to skip: if you are not moving in 90 seconds, leave it.','Misread':'Underline what is being asked and re-read the last line of the question before answering.'};
function weakSpots(){
  const m={};
  state.errors.forEach(e=>{
    const k=(e.topic||'').trim().toLowerCase();if(!k)return;
    const o=m[k]||(m[k]={name:e.topic.trim(),count:0,open:0,types:{},section:e.section});
    o.count++;if(!e.revised)o.open++;o.types[e.mistake]=(o.types[e.mistake]||0)+1;
  });
  const arr=Object.keys(m).map(k=>m[k]);
  arr.forEach(o=>{o.score=o.open*2+(o.count-o.open);o.top=Object.keys(o.types).sort((a,b)=>o.types[b]-o.types[a])[0];});
  arr.sort((a,b)=>b.score-a.score||b.count-a.count);
  const tc={};state.errors.forEach(e=>{tc[e.mistake]=(tc[e.mistake]||0)+1;});
  const topType=Object.keys(tc).sort((a,b)=>tc[b]-tc[a])[0]||null;
  return {top:arr.slice(0,3),topType,tc,n:state.errors.length};
}
function weakSpotPanel(){
  const w=weakSpots();
  let h='<div class="panel"><h3>Weak-spot finder</h3>';
  if(w.n<3)return h+'<p class="muted">Log at least 3 errors and this panel will name your weakest topics and your most common mistake type.</p></div>';

function suggestMocks(){
  const ps=planSettings(),today=todayISO(),out=[];
  const have=new Set(state.mockPlan.map(p=>p.date+'|'+p.type));
  let d=today>ps.s?today:ps.s;
  while(parse(d).getDay()!==0)d=addDays(d,1);
  const add=(date,type,name)=>{const k=date+'|'+type;if(have.has(k)||date<today||date>ps.c)return;have.add(k);out.push({id:uid(),date,type,name,done:false});};
  while(d<=addDays(ps.c,-7)){
    if(d<=ps.conceptsEnd){if(parse(d).getDate()<=7)add(d,'Topic test','Monthly topic test');}
    else if(d<ps.sprintStart){const wk=Math.floor(daysBetween(ps.conceptsEnd,d)/7);if(wk%2===0)add(d,'Full mock','Full mock');else add(d,'Sectional','Sectional test');}
    else add(d,'Full mock','Full mock');
    d=addDays(d,7);
  }
  return out;
}

// ---------- DILR and RC practice ----------
function dilrAnalysis(){
  const rows=DILR_TYPES.map(t=>{
    const l=state.dilr.filter(x=>x.type===t);
    const att=l.filter(x=>x.attempted==='Attempted');
    const tot=att.reduce((s,x)=>s+num(x.total),0),cor=att.reduce((s,x)=>s+num(x.correct),0);
    const acc=tot?Math.round(cor/tot*100):null;
    const avgMin=att.length?avg(att.map(x=>num(x.minutes))):null;
    let verdict='Need more data (3+ sets)';
    if(l.length>=3){
      if(att.length===0)verdict='Always skipped. Try one untimed.';
      else if(acc!==null&&acc>=70&&avgMin<=18)verdict='Pick first';
      else if((acc!==null&&acc<40)||avgMin>24)verdict='Skip or save for last';
      else verdict='Pick if time allows';
    }
    return {type:t,n:l.length,att:att.length,rate:l.length?Math.round(att.length/l.length*100):0,avgMin,acc,verdict};
  }).filter(r=>r.n>0);
  return rows;
}
function rcAnalysis(){
  const rows=RC_TYPES.map(t=>{
    const l=state.rc.filter(x=>x.type===t);
    const tot=l.reduce((s,x)=>s+num(x.total),0),cor=l.reduce((s,x)=>s+num(x.correct),0);
    const wpms=l.filter(x=>num(x.minutes)>0&&num(x.words)>0).map(x=>num(x.words)/num(x.minutes));
    return {type:t,n:l.length,acc:tot?Math.round(cor/tot*100):null,wpm:wpms.length?avg(wpms):null};
  }).filter(r=>r.n>0);
  return rows;
}

function idbOpen(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined'){rej(new Error('no indexedDB'));return;}
    const r=indexedDB.open('lifecat-files',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('files',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function idbPut(id,blob){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,blob});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(id){const db=await idbOpen();return new Promise((res,rej)=>{const q=db.transaction('files','readonly').objectStore('files').get(id);q.onsuccess=()=>res(q.result?q.result.blob:null);q.onerror=()=>rej(q.error);});}
async function idbDel(id){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){}}

function postingStreak(){
  const weeks=new Set(state.posts.filter(p=>p.status==='Posted').map(p=>mondayOf(p.date)));
  let cur=mondayOf(todayISO());
  if(!weeks.has(cur))cur=addDays(cur,-7);
  let n=0;while(weeks.has(cur)){n++;cur=addDays(cur,-7);}
  const ws=Array.from(weeks).sort();let best=0,run=0;
  for(let i=0;i<ws.length;i++){run=(i>0&&daysBetween(ws[i-1],ws[i])===7)?run+1:1;if(run>best)best=run;}
  return {current:n,best};
}

function barChartSvg(labels,values,fmt){
  const W=640,H=200,L=14,R=14,T=22,B=30,n=labels.length,max=Math.max(1,Math.max.apply(null,values));
  const bw=(W-L-R)/n;
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Contributions by month">';
  values.forEach((v,i)=>{
    const hh=(H-T-B)*(v/max),x=L+i*bw+bw*0.18,y=H-B-hh;
    svg+='<rect class="bar-r" x="'+x+'" y="'+y+'" width="'+(bw*0.64)+'" height="'+Math.max(0,hh)+'" rx="3"><title>'+esc(labels[i]+': '+fmt(v))+'</title></rect>';
    if(v>0)svg+='<text class="ch-txt" x="'+(x+bw*0.32)+'" y="'+(y-5)+'" text-anchor="middle">'+esc(fmt(v))+'</text>';
    svg+='<text class="ch-txt" x="'+(x+bw*0.32)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  return svg+'</svg>';
}

function liftSummary(){
  const by={};
  state.lifts.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>{const k=(l.exercise||'').trim().toLowerCase();if(!k)return;(by[k]=by[k]||{name:l.exercise.trim(),list:[]}).list.push(l);});
  return Object.keys(by).map(k=>{
    const o=by[k],last=o.list[o.list.length-1];
    const best=Math.max.apply(null,o.list.map(x=>num(x.weight)));
    const target=num(last.target);
    let note='Keep going.';
    if(target&&num(last.reps)>=target)note='You hit the top of your rep range. Add the smallest jump (about 2.5 kg) next time.';
    else if(target)note='Aim for '+target+' reps at '+last.weight+' kg before adding weight.';
    return {name:o.name,sessions:o.list.length,last,best,note};
  });
}

function monthReport(mk){
  const first=mk+'-01';
  const d0=parse(first);const nm=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
  const last=mk+'-'+pad(nm);
  const dates=Array.from({length:nm},(_,i)=>addDays(first,i));
  const st=statsForDates(dates);
  const inM=d=>d.slice(0,7)===mk;
  const cat=[st.quant,st.dilr,st.varc];
  const mocks=state.mocks.filter(m=>inM(m.date)).sort((a,b)=>a.date<b.date?-1:1);
  const pc=mocks.filter(m=>m.percentile!=null);
  const errs=state.errors.filter(e=>inM(e.date));
  const mt={};errs.forEach(e=>{mt[e.mistake]=(mt[e.mistake]||0)+1;});
  const topMistake=Object.keys(mt).sort((a,b)=>mt[b]-mt[a])[0];
  const trig={};dates.forEach(d=>{const e=state.daily[d];if(e&&e.trigger)trig[e.trigger]=(trig[e.trigger]||0)+1;});
  const topTrig=Object.keys(trig).sort((a,b)=>trig[b]-trig[a]);
  const reading=state.reading.filter(r=>inM(r.date)).reduce((s,r)=>s+num(r.minutes),0);
  const posts=state.posts.filter(p=>inM(p.date)&&p.status==='Posted').length;
  const pages=state.scripts.filter(x=>inM(x.date)).reduce((s,x)=>s+num(x.pages),0);
  const fund=state.fund.items.filter(x=>inM(x.date)).reduce((s,x)=>s+num(x.amount),0);
  const lifts=state.lifts.filter(x=>inM(x.date)).length;
  const watched=state.content.filter(c=>inM(c.date)).length;
  const logged=dates.filter(d=>flagsOn(d).has&&d>=state.meta.startDate);
  let bestDay=null;logged.forEach(d=>{const p=flagsOn(d).points;if(!bestDay||p>bestDay.p)bestDay={d,p};});
  let run=0,bestRun=0;dates.forEach(d=>{if(flagsOn(d).showedUp||paused(d)){run++;if(run>bestRun)bestRun=run;}else run=0;});
  const wts=logged.map(d=>num(state.daily[d].weight)).filter(x=>x>0);
  const blocked=logged.map(d=>({d,t:state.daily[d].blocked})).filter(x=>x.t).slice(-3);
  return {mk,st,cat,mocks,pc,errs,topMistake,topTrig,trig,reading,posts,pages,fund,lifts,watched,bestDay,bestRun,wts,blocked,logged};
}

// ---------- week: trend charts and insights ----------
function trendChart(title,dates,series,minV){
  const all=[];series.forEach(s=>s.values.forEach(v=>{if(v!=null)all.push(v);}));
  const head='<div class="panel"><h3>'+esc(title)+'</h3>';
  if(all.length<2)return head+'<div class="empty">Log a few more days to see this chart.</div></div>';
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  const pad2=Math.max(0.5,(hi-lo)*0.15);lo=minV!=null?minV:lo-pad2;hi+=pad2;
  const W=640,H=200,L=40,R=14,T=12,B=30,n=dates.length;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;svg+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ch-txt" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>';}
  const stepL=Math.max(1,Math.round(n/6));
  for(let i=0;i<n;i+=stepL)svg+='<text class="ch-txt" x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(fmtShort(dates[i]))+'</text>';
  series.forEach(s=>{
    if(s.line){
      let seg=[];
      const flush=()=>{if(seg.length>1)svg+='<polyline class="'+s.cls+'" fill="none" points="'+seg.join(' ')+'"/>';seg=[];};
      s.values.forEach((v,i)=>{if(v==null)flush();else seg.push(X(i)+','+Y(v));});flush();
    }
    if(s.dots)s.values.forEach((v,i)=>{if(v!=null)svg+='<circle class="td-raw" cx="'+X(i)+'" cy="'+Y(v)+'" r="3"><title>'+esc(fmtShort(dates[i])+': '+(Math.round(v*10)/10))+'</title></circle>';});
  });
  svg+='</svg>';
  const legend='<div class="chips" style="margin-top:6px;">'+series.map(s=>'<span class="tag">'+esc(s.label)+'</span>').join('')+'</div>';
  return head+svg+legend+'</div>';
}

// ---------- today: nudges and streak freezes ----------
function freezesEarned(){return Math.floor(totalPoints()/POINTS_PER_LEVEL);}
function freezesUsed(){return Object.keys(state.pauses).filter(d=>(state.pauses[d]||{}).reason==='Streak freeze').length;}
function freezesAvailable(){return Math.max(0,freezesEarned()-freezesUsed());}
function streakBefore(d){
  let n=0,cur=addDays(d,-1),guard=0;
  while(guard++<400){const f=flagsOn(cur);if(cur<state.meta.startDate)break;if(f.showedUp){n++;cur=addDays(cur,-1);}else if(paused(cur)){cur=addDays(cur,-1);}else break;}
  return n;
}
function todayNudges(){
  const today=todayISO();let h='';
  // yesterday's priority
  for(let i=1;i<=4;i++){const d=addDays(today,-i),e=state.daily[d];if(e&&e.tomorrow){h+='<div class="banner info"><span><strong>Your priority from '+(i===1?'yesterday':esc(fmtShort(d)))+':</strong> '+esc(e.tomorrow)+'</span></div>';break;}}
  // freeze offer
  if(freezesAvailable()>0){
    for(let i=1;i<=3;i++){const d=addDays(today,-i);
      if(d>=state.meta.startDate&&!flagsOn(d).showedUp&&!paused(d)&&streakBefore(d)>=3){
        h+='<div class="banner warn"><span>You missed '+esc(fmtShort(d))+' after a '+streakBefore(d)+'-day streak. You have '+freezesAvailable()+' streak freeze'+(freezesAvailable()===1?'':'s')+'.</span><button type="button" class="btn small" data-action="use-freeze" data-date="'+d+'">Use a freeze</button></div>';break;}}
  }
  // mocks due
  const md=mockDueSoon();
  if(md.length)h+='<div class="banner info"><span><strong>Mock due:</strong> '+md.slice(0,2).map(p=>esc(p.name)+' on '+esc(fmtShort(p.date))+(p.date<today?' (overdue)':'')).join(', ')+'.</span><button type="button" class="link" data-action="goto-mocks">Open mocks</button></div>';
  // flashcards

let syncTimer=null;
function scheduleSync(){
  if(!state.meta||!state.meta.syncOn||!state.meta.syncUrl)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncNow(false);},4000);
}
function fmtSyncTime(){
  const t=state.meta&&state.meta.syncLast;
  if(!t)return 'Nothing sent yet.';
  const d=new Date(t);return 'Last sent '+d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' (the dashboard cannot confirm it arrived).';
}
async function syncNow(manual){
  const url=state.meta.syncUrl;
  if(!url){toast('Add your script link first.');return;}
  try{
    buildCache();
    const raw=buildTables(),tables={};
    Object.keys(raw).forEach(n=>{const w=raw[n][0].length;tables[n]=raw[n].map(r=>{const x=r.map(v=>v==null?'':v);while(x.length<w)x.push('');return x;});});
    const payload={secret:state.meta.syncSecret||'',sentAt:new Date().toISOString(),tables};
    await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    state.meta.syncLast=payload.sentAt;
    try{await storageAPI.set(NS+'-meta',JSON.stringify(state.meta),false);}catch(e){}
    const el=document.getElementById('sync-last');if(el)el.textContent=fmtSyncTime();
    if(manual)toast('Sent. Check your sheet in a few seconds.');
  }catch(e){if(manual)toast('Could not reach the script. Check the link and your connection.');}
}

    '<textarea readonly id="script-text" rows="10" style="font-family:monospace;font-size:12px;">'+esc(APPS_SCRIPT)+'</textarea><button type="button" class="btn ghost small" style="margin-top:8px;" data-action="copy-script">Copy the script</button></div></details>'+
    '<div class="field"><label class="f">Web app URL</label><input type="text" name="url" value="'+esc(m.syncUrl||'')+'" placeholder="https://script.google.com/macros/s/.../exec"></div>'+
    '<div class="field"><label class="f">Secret word (must match the script)</label><input type="text" name="secret" value="'+esc(m.syncSecret||'')+'"></div>'+
    '<div class="field"><div class="chips"><label class="chip"><input type="checkbox" name="on"'+(m.syncOn?' checked':'')+'><span>Send automatically after each save</span></label></div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button type="submit" class="btn">Save sync settings</button><button type="button" class="btn ghost" data-action="sync-now">Send everything now</button></div>'+
    '<p class="small muted" style="margin-top:10px;" id="sync-last">'+esc(fmtSyncTime())+'</p>'+
    '<p class="small muted">Two things to know. The dashboard sends the data but cannot see whether the sheet received it, so check the sheet now and then. And anyone who has the web app URL could write to your sheet, so keep it private. The secret word is only a light extra barrier, because it is stored in this browser.</p></form>';
}

function plTotal(d){return d.steps.length+d.deliver.length;}
function plDone(d){let c=0;const m=state.plannerDone||{};d.steps.forEach((_,i)=>{if(m[d.date+'#s'+i])c++;});d.deliver.forEach((_,i)=>{if(m[d.date+'#d'+i])c++;});return c;}
function plMatch(d){
  const f=ui.plF||'all',q=ui.plQ||'';
  if(f!=='all'){if(f==='mock'||f==='test'||f==='review'){if(d.tag!==f)return false;}else if(d.sec.indexOf(f)<0)return false;}
  if(q){const hay=(d.title+' '+d.topic+' '+d.focus+' '+d.subs.join(' ')+' '+d.sec+' '+d.phase+' '+d.date).toLowerCase();if(hay.indexOf(q)<0)return false;}
  return true;
}
function plCard(d,open){

  let h='<details class="pday'+(d.date===td?' today':'')+(c===t?' done':'')+'" id="pd-'+d.date+'"'+(open?' open':'')+'><summary><span class="pdd">'+esc(d.dow)+' '+esc(fmtShort(d.date))+'<small>Day '+d.n+'</small></span><span class="ptt">'+esc(d.title)+'<small>'+esc(d.focus||d.sec)+'</small></span><span class="prt">'+tag+'<span class="tag">'+esc(d.phase)+'</span><span class="ppr" id="pp-'+d.date+'">'+c+'/'+t+'</span></span></summary><div class="pbody">';
  h+='<div class="pmeta"><span>'+esc(d.week)+'</span><span>Suggested slot: '+esc(d.slot)+'</span><span>'+d.mins+' min</span></div>';
  if(d.subs.length)h+='<h4>Subtopics today</h4><ul style="margin:4px 0 0;padding-left:20px;font-size:14px;">'+d.subs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  h+='<h4>Plan</h4><div class="plk">'+d.steps.map((s,i)=>{const id=d.date+'#s'+i;return '<label><input type="checkbox" data-pk="'+id+'"'+(state.plannerDone[id]?' checked':'')+'><span><span class="m">'+s[0]+' min</span> '+esc(s[1])+'</span></label>';}).join('')+'</div>';
  h+='<h4>Deliverables from you</h4><div class="plk">'+d.deliver.map((s,i)=>{const id=d.date+'#d'+i;return '<label><input type="checkbox" data-pk="'+id+'"'+(state.plannerDone[id]?' checked':'')+'><span>'+esc(s)+'</span></label>';}).join('')+'</div>';
  if(d.mvd)h+='<div class="pnote gold"><b>Minimum version (rough day):</b> '+esc(d.mvd)+'</div>';

  return h+'</div></details>';
}
function plDaysHtml(){

  });
  return html||'<div class="panel muted">No days match that filter.</div>';
}

function plRefresh(date){

function renderHero(){
  const t=todayISO(),s=state.meta.startDate,c=state.meta.catDate;
  const dayNum=daysBetween(s,t)+1;
  const toCat=Math.max(0,daysBetween(t,c));
  const ph=phaseOn(t);
  const total=Math.max(1,daysBetween(s,c));
  const pct=clamp(Math.round(daysBetween(s,t)/total*100),0,100);
  let dayLine;
  if(dayNum<1)dayLine='Starts in '+(1-dayNum)+' day'+((1-dayNum)===1?'':'s');
  else if(dayNum<=TOTAL_DAYS)dayLine='Day '+dayNum+' of '+TOTAL_DAYS;
  else dayLine='Day '+dayNum+' (past the first '+TOTAL_DAYS+')';
  return '<header class="hero"><div class="hero-grid">'+
    '<div><span class="count-num">'+toCat+'</span><span class="count-label">days to CAT, about '+Math.floor(toCat/7)+' weeks</span></div>'+
    '<div class="hero-side"><div class="day">'+esc(dayLine)+'</div>'+
    '<p>CAT phase: '+esc(ph.cat)+'</p>'+(ph.other?'<p>Alongside: '+esc(ph.other)+'</p>':'')+
    '<p style="color:#aeb7d2;font-size:13px;">Exam day assumed as '+esc(fmtLong(c))+'. Change it in Data once the date is announced.</p></div></div>'+
    '<div class="timeline" aria-hidden="true"><div class="timeline-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="timeline-ends"><span>'+esc(fmtShort(s))+' '+parse(s).getFullYear()+'</span><span>'+pct+'% of the way to exam day</span><span>'+esc(fmtShort(c))+' '+parse(c).getFullYear()+'</span></div></header>';
}

}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function toCSV(aoa){
  return '\uFEFF'+aoa.map(r=>r.map(v=>{
    if(v===null||v===undefined)return '';
    if(typeof v==='boolean')return v?'TRUE':'FALSE';
    const s=String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\r\n');
}
function exportXlsx(){
  buildCache();
  const tables=buildTables();
  if(typeof XLSX==='undefined'){alert('The spreadsheet library could not load (you may be offline). Use "Download this tab as CSV" instead, or try again with an internet connection.');return;}
  const wb=XLSX.utils.book_new();

}

      quant:numOrNull(g('quant')),dilr:numOrNull(g('dilr')),varc:numOrNull(g('varc')),skill:g('skill')||'',hobbyType:g('hobbyType')||'',

      well:(g('well')||'').trim(),blocked:(g('blocked')||'').trim(),tomorrow:(g('tomorrow')||'').trim(),trigger:g('trigger')||''};
    const wantPause=on('pause');

function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
async function onClick(ev){
  const el=ev.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'tab':ui.tab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case 'cat-tab':ui.catTab=el.dataset.tab;render();break;
    case 'lib-tab':ui.libTab=el.dataset.tab;render();break;
    case 'week-prev':ui.weekStart=addDays(ui.weekStart,-7);render();break;
    case 'week-next':ui.weekStart=addDays(ui.weekStart,7);render();break;
    case 'week-now':ui.weekStart=mondayOf(todayISO());render();break;
    case 'edit-daily':ui.logDate=el.dataset.date;render();window.scrollTo(0,0);break;
    case 'del-daily':if(confirm('Delete the entry for '+fmtShort(el.dataset.date)+'?')){delete state.daily[el.dataset.date];delete state.pauses[el.dataset.date];await save('daily');await save('pauses');render();}break;
    case 'theme':cycleTheme();render();break;
    case 'pause-today':state.pauses[todayISO()]={reason:el.dataset.reason};await save('pauses');render();toast('Paused today. Your streaks are protected.');break;
    case 'unpause-today':delete state.pauses[todayISO()];await save('pauses');render();break;
    case 'rev-pass':{
      state.errors.forEach(x=>{if(x.id===id){x.rev=num(x.rev)+1;x.lastRev=todayISO();if(x.rev>=4)x.revised=true;}});
      await save('errors');render();toast('Revision logged');break;}
    case 'copy-recap':{
      const txt=document.getElementById('recap-text').textContent;
      const done=()=>toast('Recap copied');
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done();});}
      else{fallbackCopy(txt);done();}
      break;}
    case 'cel-close':document.getElementById('celebrate').hidden=true;break;
    case 'timer-preset':document.getElementById('timer-min').value=el.dataset.min;break;
    case 'timer-start':{
      const mode=document.getElementById('timer-mode').value;
      const mins=clamp(parseInt(document.getElementById('timer-min').value,10)||50,1,240);

function cxCustom(){
 if(!state.fit)state.fit=fxFreshFit();
 if(!state.fit.custom||typeof state.fit.custom!=='object'||Array.isArray(state.fit.custom))state.fit.custom={};
 FIT_ORDER.forEach(k=>{if(!Array.isArray(state.fit.custom[k]))state.fit.custom[k]=[];});

function cxList(){if(!Array.isArray(state.cardio))state.cardio=[];return state.cardio;}
function cxBaseNames(type){const s=new Set();['P1','P2'].forEach(p=>(PROG[p][type]||[]).forEach(e=>s.add(e.n.toLowerCase())));return s;}
function cxRange(v){const m=String(v||'').match(/(\d+)\s*(?:(?:-|–|to)\s*(\d+))?/);if(!m)return [8,12];const a=parseInt(m[1],10),b=m[2]?parseInt(m[2],10):a;return [Math.min(a,b),Math.max(a,b)];}
function cxRemember(type,name,sets,rg){
 const c=cxCustom()[type];
 if(cxBaseNames(type).has(name.toLowerCase()))return false;
 if(c.some(x=>x.n.toLowerCase()===name.toLowerCase()))return false;
 c.push({n:name,s:clamp(sets||3,1,8),lo:rg[0],hi:rg[1],rest:'60–90 s',added:todayISO()});
 return true;
}
function cxNames(){
 const s=new Set(CX_COMMON);
 FIT_ORDER.forEach(k=>cxCustom()[k].forEach(c=>s.add(c.n)));
 (state.workouts||[]).forEach(w=>(w.ex||[]).forEach(e=>{if(e.custom)s.add(e.n);}));
 return Array.from(s).sort((a,b)=>a.localeCompare(b));

function cxFromForm(fd,p,m,date,extra){

function cxDesc(x){

 if(x.m==='treadmill'){if(x.speed)b.push(x.speed+' km/h');if(x.incline!=null)b.push(x.incline+'% incline');}

}

// ---------- push a missed day: the rest of the week moves by a day, Friday's revision folds into Saturday ----------
function xApplyShifts(){
 PLAN.days.forEach(d=>{if(d.orig===undefined){d.orig=d.date;d.origDow=d.dow;}d.date=d.orig;d.dow=d.origDow;d.dropped=false;d.folded='';});
 const list=state.extra&&Array.isArray(state.extra.plShifts)?state.extra.plShifts:[];
 list.forEach(D=>{
  const ws=mondayOf(D),fri=addDays(ws,4),sat=addDays(ws,5);
  const moving=PLAN.days.filter(x=>!x.dropped&&x.date>=D&&x.date<fri),fd=PLAN.days.find(x=>!x.dropped&&x.date===fri);
  if(fd){fd.dropped=true;fd.date='x'+fd.orig;const sd=PLAN.days.find(x=>x.date===sat);if(sd)sd.folded=fd.title;}
  moving.forEach(x=>{x.date=addDays(x.date,1);x.dow=X_DOW[parse(x.date).getDay()];});
 });
}

// ---------- percentile calculator ----------
function xParseTable(s){return String(s||'').split(',').map(p=>p.split(':').map(x=>parseFloat(x))).filter(p=>p.length===2&&!isNaN(p[0])&&!isNaN(p[1])).sort((a,b)=>a[0]-b[0]);}
function xPct(kind,score){
 const tb=xParseTable(state.extra.pct[kind]);if(tb.length<2||score==null||isNaN(score))return null;
 if(score<=tb[0][0])return tb[0][1];
 for(let i=1;i<tb.length;i++){if(score<=tb[i][0]){const a=tb[i-1],b=tb[i];return a[1]+(b[1]-a[1])*(score-a[0])/(b[0]-a[0]);}}
 return tb[tb.length-1][1];
}

// ---------- mock prediction ----------
function xPredict(){
 const ms=state.mocks.filter(m=>m.type==='Full mock'&&m.percentile!=null&&m.percentile!=='').slice().sort((a,b)=>a.date<b.date?-1:1).slice(-10);
 if(ms.length<3)return {ms,ok:false};
 // Fit on a log-odds scale, so the projection slows down near 100 the way percentiles really do.
 const lg=p=>{p=clamp(p,1,99.9)/100;return Math.log(p/(1-p));},ex=z=>100/(1+Math.exp(-z));
 const x0=ms[0].date,xs=ms.map(m=>daysBetween(x0,m.date)),ys=ms.map(m=>num(m.percentile)),zs=ys.map(lg),n=ms.length,mx=avg(xs),mz=avg(zs);
 let sxx=0,sxz=0;xs.forEach((x,i)=>{sxx+=(x-mx)*(x-mx);sxz+=(x-mx)*(zs[i]-mz);});
 const b=sxx?sxz/sxx:0,a=mz-b*mx,xe=Math.max(1,daysBetween(x0,state.meta.catDate)),ze=a+b*xe;
 let ss=0;xs.forEach((x,i)=>{const r=zs[i]-(a+b*x);ss+=r*r;});const sd=n>2?Math.sqrt(ss/(n-2)):0;
 const xl=xs[n-1],fit=x=>ex(a+b*x);
 return {ms,ok:true,fit,x0,xs,ys,xe,pred:clamp(ex(ze),0,99.9),lo:clamp(ex(ze-sd),0,99.9),hi:clamp(ex(ze+sd),0,99.9),perWeek:fit(xl)-fit(Math.max(0,xl-7)),last:ys[n-1]};
}
function xPredictPanel(){
 const p=xPredict(),tgt=state.meta.catTarget,t=todayISO();
 let h='<div class="panel"><h3>Mock score prediction</h3>';
 if(!p.ok)return h+'<div class="empty">Log at least 3 full mocks with a percentile ('+p.ms.length+' so far). A trend line projected to exam day will appear here. Mock 1 is planned for 2 May 2027.</div><p class="small muted">Set a target percentile in the Data tab to compare against it.</p></div>';
 const W=640,H=250,L=40,R=16,T=14,B=34,X=dx=>L+(W-L-R)*dx/p.xe;
 const lo=Math.max(0,Math.floor((Math.min.apply(null,p.ys.concat([p.lo],tgt!=null?[tgt]:[]))-5)/10)*10),Y=v=>T+(H-T-B)*(1-(v-lo)/(100-lo));
 const xl=p.xs[p.xs.length-1],yAt=x=>clamp(p.fit(x),lo,100);
 let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mock percentile trend projected to exam day">';
 for(let v=lo;v<=100;v+=(100-lo)>50?20:10)svg+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ch-txt" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
 if(tgt!=null)svg+='<line class="ch-target" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tgt)+'" y2="'+Y(tgt)+'"/><text class="ch-txt" x="'+(L+4)+'" y="'+(Y(tgt)-5)+'">Target '+tgt+'</text>';
 const pts=(a,b)=>Array.from({length:21},(_,i)=>{const x=a+(b-a)*i/20;return X(x)+','+Y(yAt(x));}).join(' ');
 svg+='<polyline class="ch-line" fill="none" points="'+pts(0,xl)+'"/><polyline class="x-proj" fill="none" points="'+pts(xl,p.xe)+'"/>';
 svg+='<line class="ch-grid" x1="'+X(p.xe)+'" x2="'+X(p.xe)+'" y1="'+T+'" y2="'+(H-B)+'"/><text class="ch-txt" x="'+(X(p.xe)-4)+'" y="'+(H-B-6)+'" text-anchor="end">Exam day</text>';
 p.ms.forEach((m,i)=>{svg+='<circle class="ch-dot" cx="'+X(p.xs[i])+'" cy="'+Y(p.ys[i])+'" r="4"><title>'+esc(m.name+': '+m.percentile+' percentile ('+fmtShort(m.date)+')')+'</title></circle>';});
 svg+='<circle class="ch-dot" cx="'+X(p.xe)+'" cy="'+Y(p.pred)+'" r="5"><title>Projected: '+r1(p.pred)+'</title></circle>';
 svg+='<text class="ch-txt" x="'+L+'" y="'+(H-10)+'">'+esc(fmtShort(p.x0))+'</text><text class="ch-txt" x="'+(W-R)+'" y="'+(H-10)+'" text-anchor="end">'+esc(fmtShort(state.meta.catDate))+'</text></svg>';
 const wl=Math.max(1,daysBetween(t,state.meta.catDate)/7),need=tgt!=null?(tgt-p.last)/wl:null;
 h+='<div class="stat-grid four"><div class="stat gold"><b>'+r1(p.pred)+'</b><span>projected on exam day</span></div><div class="stat"><b>'+r1(p.lo)+' to '+r1(p.hi)+'</b><span>likely range</span></div><div class="stat"><b>'+(p.perWeek>=0?'+':'')+r1(p.perWeek)+'</b><span>percentile a week right now</span></div><div class="stat"><b>'+(tgt!=null?tgt:'-')+'</b><span>your target</span></div></div>'+svg;
 if(tgt!=null)h+='<p class="small" style="margin-top:8px;">'+(p.pred>=tgt?'<b>On track.</b> At this rate you pass your target before exam day. Protect it: keep the autopsies honest.':'<b>Below target at the current rate.</b> From your latest '+r1(p.last)+', you need about +'+r1(Math.max(0,need))+' percentile a week from now on. Work the Weak-spot finder and the heatmap.')+'</p>';
 return h+'<p class="small muted">Uses your last 10 full mocks with a percentile, fitted on a curve that slows near 100 because the last few percentiles are the hardest. Early on, a few mocks can swing it a lot: treat it as a direction, not a promise.</p></div>';
}

// ---------- topic heatmap ----------
function xTopicStats(){
 return rwMemo('topicstats',()=>{
  const S={},byName={};
  state.syllabus.forEach(tp=>{S[tp.id]={err:0,open:0,c:0,tot:0};byName[tp.name.toLowerCase()]=tp.id;});
  state.errors.forEach(e=>{const k=(e.topic||'').trim().toLowerCase();if(!k)return;let id=byName[k];
   if(!id&&k.length>=4){const tp=state.syllabus.find(tp=>{const n=tp.name.toLowerCase();return k.indexOf(n)>=0||n.indexOf(k)>=0;});if(tp)id=tp.id;}
   if(id){S[id].err++;if(!e.revised)S[id].open++;}});
  state.dilr.forEach(x=>{const id=byName[(x.type||'').toLowerCase()];if(id&&x.attempted==='Attempted'&&num(x.total)>0){S[id].c+=num(x.correct);S[id].tot+=num(x.total);}});
  state.syllabus.forEach(tp=>{const s=S[tp.id],acc=s.tot?s.c/s.tot:null;
   s.score=s.open*2+(s.err-s.open)+(acc!=null&&acc<0.6?3:0)-(tp.status==='Mastered'?1:0);
   s.lvl=s.score<=0?(tp.status==='Not started'?'ns':(tp.status==='Learning'?'lr':'ok')):(s.score<=2?'w1':(s.score<=5?'w2':'w3'));
   s.line=(s.err?s.err+' error'+(s.err===1?'':'s')+(s.open?', '+s.open+' open':''):'no errors')+(acc!=null?' \u00B7 '+Math.round(acc*100)+'%':'');
   s.tip=tp.name+' ('+tp.status+'): '+s.line;});
  return S;
 });
}
